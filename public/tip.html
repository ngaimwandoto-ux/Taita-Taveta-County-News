<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Send us a tip</title><link rel="stylesheet" href="/style.css"></head>
<body class="form page"><div class="mast"><img src="/logo-review.png" alt="The County Review"><img src="/logo-roundup.png" alt="County Roundup"></div>
<h1>Send us a tip</h1><p>Saw something happening? Tell us. We check every tip, and we never publish your name without asking you.</p>
<label for="t">What happened? <small>(a few sentences)</small></label><textarea id="t" rows="5" maxlength="1000"></textarea>
<label for="s">Where?</label><select id="s"><option value="voi">Voi</option><option value="taveta">Taveta</option><option value="mwatate">Mwatate</option><option value="wundanyi">Wundanyi</option></select>
<label for="p">Place name <small>(optional)</small></label><input id="p" maxlength="80">
<button class="alt" id="loc" type="button">Add my location</button><small id="ls"></small>
<label for="ph">Photo <small>(optional)</small></label><input id="ph" type="file" accept="image/*">
<label for="c">Your phone number <small>(optional, 2547XXXXXXXX, only if you are happy for us to call)</small></label><input id="c" inputmode="numeric">
<input id="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
<button id="go" type="button">Send tip</button><div id="m" hidden role="status"></div>
<script>
const $=s=>document.querySelector(s);let pos=null,photo=null;
$('#loc').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{pos=p.coords;$('#ls').textContent=' Location added.'},()=>{$('#ls').textContent=' Could not get location.'});
$('#ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const b=await createImageBitmap(f),sc=Math.min(1,1280/Math.max(b.width,b.height)),cv=document.createElement('canvas');cv.width=Math.round(b.width*sc);cv.height=Math.round(b.height*sc);cv.getContext('2d').drawImage(b,0,0,cv.width,cv.height);photo=await new Promise(r=>cv.toBlob(r,'image/jpeg',.78))}catch{photo=null}};
$('#go').onclick=async()=>{const m=$('#m');m.hidden=false;m.className='';m.textContent='Sending...';
 try{const r=await fetch('/api/tips',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:$('#t').value,sub_county:$('#s').value,place_name:$('#p').value,contact:$('#c').value,website:$('#website').value,latitude:pos?.latitude,longitude:pos?.longitude})});
  const d=await r.json();if(!r.ok)throw new Error(d.error);
  if(photo&&d.id)await fetch(`/api/tips/${d.id}/photo`,{method:'POST',headers:{'content-type':'image/jpeg','x-tip-token':d.token},body:photo}).catch(()=>{});
  m.textContent='Thank you. Your tip has reached our team.';$('#t').value=''}catch(e){m.className='e';m.textContent=e.message||'Could not send. Check your connection and try again.'}};
</script></body></html>
