<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your listing report</title><link rel="stylesheet" href="/style.css"></head>
<body class="form page"><div class="mast"><img src="/logo-review.png" alt="The County Review"><img src="/logo-roundup.png" alt="County Roundup"></div>
<h1>Your listing report</h1><div id="out"><p class="msg">Loading...</p></div>
<script>
const $=s=>document.querySelector(s),el=(t,p={},k=[])=>{const n=Object.assign(document.createElement(t),p);n.append(...k);return n};
const row=(a,b)=>el('div',{className:'row'},[el('span',{textContent:a}),el('b',{textContent:String(b)})]);
(async()=>{try{const t=new URLSearchParams(location.search).get('t'),r=await fetch('/api/report/'+encodeURIComponent(t||''));const d=await r.json();if(!r.ok)throw new Error(d.error);
 $('#out').replaceChildren(el('h2',{textContent:d.business}),row('Listing status',d.status+(d.expires_at?' until '+String(d.expires_at).slice(0,10):'')),row('Taps on your Chat button, last 30 days',d.taps_total),row('Views of your sub-county feed, last 30 days',d.area_views),
  el('h3',{textContent:'Taps by day'}),...(d.taps_by_day.length?d.taps_by_day.map(x=>row(String(x.day).slice(0,10),x.n)):[el('p',{className:'msg',textContent:'No taps yet.'})]));
 }catch(e){$('#out').replaceChildren(el('p',{className:'msg',textContent:e.message||'Report not found.'}))}})();
</script></body></html>
