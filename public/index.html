<script>
const $ = s => document.querySelector(s);
const st = { view: 'today', paper: 'review', topic: '', sub: localStorage.getItem('sub') || 'voi', lang: localStorage.getItem('lang') || 'en', pos: null };
$('#sub').value = st.sub;
const el = (t, p = {}, k = []) => { const n = Object.assign(document.createElement(t), p); n.append(...k); return n; };
const opts = (list, label = x => x) => list.map(v => el('option', { value: Array.isArray(v) ? v[0] : v, textContent: Array.isArray(v) ? v[1] : label(v) }));
const safeUrl = u => { try { const x = new URL(u, location.href); return ['http:', 'https:'].includes(x.protocol) ? x.href : ''; } catch { return ''; } };
const track = (kind, ref) => navigator.sendBeacon?.('/api/events', new Blob([JSON.stringify({ kind, ref, sub_county: st.sub })], { type: 'application/json' }));
const j = async u => { const r = await fetch(u); if (!r.ok) throw new Error(); return r.json(); };
const msg = t => el('p', { className: 'msg', textContent: t });
const sect = (t, k) => el('section', { className: 'blk' }, [el('h3', { textContent: t }), ...k]);
const km = (a, m) => { const r = x => x * Math.PI / 180, dl = r(m.latitude - a[0]), dn = r(m.longitude - a[1]);
  return 12742 * Math.asin(Math.sqrt(Math.sin(dl / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(m.latitude)) * Math.sin(dn / 2) ** 2)); };

function player(url, ref, poster) {
  const b = el('button', { textContent: '▶', ariaLabel: 'Play video' }), box = el('div', { className: 'vid' }, [b]);
  if (safeUrl(poster)) box.prepend(el('img', { src: safeUrl(poster), alt: '', loading: 'lazy', className: 'poster' }));
  const yt = safeUrl(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  b.onclick = () => { track('video_play', ref); box.replaceChildren(yt
    ? el('iframe', { src: `https://www.youtube-nocookie.com/embed/${yt[1]}?autoplay=1`, allow: 'autoplay; encrypted-media', allowFullscreen: true, title: 'Video' })
    : el('video', { src: safeUrl(url), controls: true, autoplay: true, preload: 'none' })); };
  return box;
}
function otherSide(s) {                            // the rival paper's lead, one tap away
  const other = st.paper === 'review' ? 'roundup' : 'review', name = other === 'roundup' ? 'County Roundup' : 'The County Review';
  return el('a', { className: 'otherside', href: '#', onclick: e => { e.preventDefault(); document.querySelector(`[data-paper="${other}"]`).click(); } },
    [el('div', { className: 'k', textContent: `Also today in ${name}` }), el('b', { textContent: s.headline }), el('div', { textContent: s.bullets[0] || '' })]);
}
function leadCard(s) { const a = card(s); a.classList.add('leadcard'); return a; }
function card(s) {
  const a = el('article');
  if (safeUrl(s.image_url)) { const i = el('img', { className: 'hero', src: safeUrl(s.image_url), alt: '', loading: 'lazy' }); i.onclick = () => i.classList.toggle('on'); a.append(i); }
  a.append(...(s.breaking ? [el('span', { className: 'tag', textContent: 'Breaking' })] : []), el('h2', { textContent: s.headline }), el('p', { className: 'by', textContent: `By ${s.reporter || 'County Desk'}, ${s.topic}` }), el('ul', {}, s.bullets.map(b => el('li', { textContent: b }))));
  if (s.has_body) { const more = el('button', { className: 'alt', textContent: 'Read full story' }); more.onclick = async () => { try { const x = await j('/api/story/' + s.id); more.replaceWith(...x.body.split(/\n+/).filter(Boolean).map(p => el('p', { textContent: p }))); } catch { more.textContent = 'Could not load. Try again.'; } }; a.append(more); }
  if (s.corrections?.length) a.append(el('div', { className: 'corr' }, [el('b', { textContent: 'Correction' }), ...s.corrections.map(c => el('p', { textContent: `${String(c.at).slice(0, 10)}: ${c.note}` }))]));
  if (safeUrl(s.video_url)) a.append(player(s.video_url, String(s.id)));
  return a;
}
const LABEL = { tender: 'Tender', bursary: 'Bursary', participation: 'Public participation', announcement: 'County announcement', factcheck: 'Fact check', job: 'Job', land: 'Land notice', court: 'Court listing', event: 'Event', lostfound: 'Lost and found', obituary: 'Obituary', notice: 'Public notice', league: 'Sports table', guide: 'Guide', history: 'Our history', transport: 'Transport', utility: 'Water and power', health: 'Health', school: 'School', weather: 'Weather', advisory: 'Farming advice' };
const note = n => el('div', { className: 'note' }, [el('div', { className: 'k', textContent: LABEL[n.kind] || n.kind }), el('b', { textContent: n.title }), el('p', { textContent: n.body }),
  n.event_date ? el('small', { textContent: 'Date: ' + String(n.event_date).slice(0, 10) }) : '']);

function bizBlock(all) {
  const sel = el('select', { ariaLabel: 'Business type' }, opts(['all', ...new Set(all.map(m => m.category))])), list = el('div');
  const near = el('button', { className: 'alt', textContent: 'Nearest first' });
  const draw = () => { let r = all.filter(m => sel.value === 'all' || m.category === sel.value); r.sort((a, b) => (b.verified ? 1 : 0) - (a.verified ? 1 : 0));
    if (st.pos) r = r.map(m => ({ ...m, d: m.latitude ? km(st.pos, m) : null })).sort((a, b) => (a.d ?? 1e9) - (b.d ?? 1e9));
    list.replaceChildren(...(r.length ? r.map(m => el('div', { className: 'row' }, [el('div', {}, [el('b', { textContent: m.business_name }), ...(m.verified ? [el('span', { className: 'vbadge', textContent: 'Verified' })] : []), el('div', { textContent: m.tagline + (m.d != null ? ` (${m.d.toFixed(1)} km)` : '') })]),
      Object.assign(el('a', { className: 'wa', href: `https://wa.me/${m.whatsapp}`, textContent: 'Chat', rel: 'noopener' }), { onclick: () => track('merchant_tap', String(m.id)) })])) : [msg('No businesses listed yet.')])); };
  sel.onchange = draw; near.onclick = () => navigator.geolocation?.getCurrentPosition(p => { st.pos = [p.coords.latitude, p.coords.longitude]; draw(); }, () => {});
  draw();
  return sect('Local businesses', [el('div', { className: 'tools' }, [sel, near]), list, el('a', { className: 'cta', href: '/biashara.html', textContent: 'List your business: KSh 600 for 14 days' })]);
}


const TC = { agriculture: '#4f7f3a', politics: '#34546e', sports: '#e8690f', business: '#7a5c8f', culture: '#a35a6a', tourism: '#3a8085', general: '#6b6a63' };
const TOWNS = [['Voi', -3.3961, 38.5561], ['Taveta', -3.3980, 37.6760], ['Mwatate', -3.5040, 38.3770], ['Wundanyi', -3.4020, 38.3680]];
const geo = async u => { try { const r = await fetch(u); return r.ok ? await r.json() : null; } catch { return null; } };
const polys = g => !g ? [] : g.type === 'FeatureCollection' ? g.features.flatMap(f => polys(f.geometry)) : g.type === 'Feature' ? polys(g.geometry) : g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
const svg = (t, a = {}, k = []) => { const n = document.createElementNS('http://www.w3.org/2000/svg', t); for (const x in a) n.setAttribute(x, a[x]); n.append(...k); return n; };
const device = () => { let d = localStorage.getItem('dev'); if (!d) { d = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '' + Math.random(); localStorage.setItem('dev', d); } return d; };
function faceoff(a) {                              // H1/H2: two sides of one argument, with a reader vote
  const b = a.pair, PN = { review: 'The County Review', roundup: 'County Roundup', both: 'Both papers' }, key = Math.min(a.id, b.id);
  const holder = el('div', {}, [card(a)]), poll = el('div', { className: 'poll' }), voted = JSON.parse(localStorage.getItem('voted') || '{}');
  const tabs = el('div', { className: 'voices' }, [a, b].map(x => el('button', { textContent: PN[x.paper] || x.paper, ariaPressed: String(x === a),
    onclick: e => { tabs.querySelectorAll('button').forEach(z => z.setAttribute('aria-pressed', String(z === e.target))); holder.replaceChildren(card(x)); } })));
  const show = votes => { const na = votes[a.id] || 0, nb = votes[b.id] || 0, t = na + nb || 1;
    const bar = (x, n) => el('div', {}, [el('div', { textContent: `${PN[x.paper] || x.paper}: ${Math.round(n / t * 100)}% (${n})` }), el('div', { className: 'bar2' }, [el('i', { style: `width:${Math.round(n / t * 100)}%` })])]);
    poll.replaceChildren(el('div', { className: 'k', textContent: 'Readers say' }), bar(a, na), bar(b, nb)); };
  const vote = async id => { try { const r = await fetch('/api/vote', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ story_id: id, device: device() }) });
    const d = await r.json(); if (!r.ok) throw 0; voted[key] = id; localStorage.setItem('voted', JSON.stringify(voted)); show(d.votes); } catch { poll.append(msg('Could not record your vote. Try again.')); } };
  if (voted[key]) vote(voted[key]);
  else poll.replaceChildren(el('div', { className: 'k', textContent: 'Which side convinced you?' }), el('div', { className: 'tools' }, [a, b].map(x => el('button', { className: 'alt', textContent: PN[x.paper] || x.paper, onclick: () => vote(x.id) }))));
  return el('section', { className: 'faceoff' }, [el('h3', { textContent: 'They say, we say' }), tabs, holder, poll]);
}
async function noticeList(kinds) {
  const r = await j(`/api/utility/${st.sub}?kinds=${kinds.join(',')}`);
  return [...(r.length ? r.map(note) : [msg('Nothing right now.')]), ...(kinds.includes('factcheck') ? [el('a', { className: 'cta', href: '/check.html', textContent: 'Is this true? Ask us' })] : [])];
}
async function marketView() {
  const d = await j(`/api/markets?sub_county=${st.sub}`), today = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date().getDay()];
  const q = el('input', { type: 'search', placeholder: 'Search traders or goods', ariaLabel: 'Search traders' }), list = el('div');
  const draw = () => { const s = q.value.toLowerCase(), r = d.traders.filter(t => !s || (t.name + ' ' + (t.goods || '')).toLowerCase().includes(s));
    list.replaceChildren(...(r.length ? r.map(t => el('div', { className: 'row' }, [el('div', {}, [el('b', { textContent: t.name }), el('div', { textContent: [t.goods, t.market].filter(Boolean).join(' · ') })]),
      el('a', { className: 'wa', href: `https://wa.me/${t.whatsapp}`, textContent: 'Chat', rel: 'noopener' })])) : [msg('No traders found.')])); };
  q.oninput = draw; draw();
  return [sect('Market days', d.markets.length ? d.markets.map(m => el('div', { className: 'row' }, [el('b', { textContent: m.name }), el('span', { textContent: m.days.map(x => x === today ? x + ' (today)' : x).join(', ') })])) : [msg('No market days listed yet.')]), sect('Traders', [q, list])];

async function sportView() {
  const d = await j(`/api/sport?sub_county=${st.sub}` + (st.league ? `&league=${st.league}` : ''));
  if (!d.leagues.length) return [msg('No leagues listed yet.')];
  const lg = el('select', { ariaLabel: 'League' }, opts(d.leagues.map(l => [l.id, l.name]))); lg.value = d.league; lg.onchange = () => { st.league = lg.value; render(); };
  const when = x => new Date(x).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  return [el('div', { className: 'tools' }, [lg]),
    sect('Next fixtures', d.fixtures.length ? d.fixtures.map(m => el('div', { className: 'row' }, [el('b', { textContent: `${m.home} v ${m.away}` }), el('span', { textContent: when(m.kickoff) + (m.venue ? ', ' + m.venue : '') })])) : [msg('No fixtures.')]),
    sect('Results', d.results.length ? d.results.map(m => el('div', { className: 'row' }, [el('span', { textContent: `${m.home} ${m.home_goals} - ${m.away_goals} ${m.away}` }), el('span', { textContent: when(m.kickoff) })])) : [msg('No results yet.')]),
    sect('Table', d.table.length ? d.table.map((t, i) => el('div', { className: 'row' }, [el('b', { textContent: `${i + 1}. ${t.team}` }), el('span', { textContent: `P${t.p} W${t.w} D${t.d} L${t.l} GD${t.gd > 0 ? '+' : ''}${t.gd}  ${t.pts} pts` })])) : [msg('No table yet.')])];
}
async function resultsView() {
  const ex = el('select', { ariaLabel: 'Exam' }, opts([['', 'All exams'], 'KCPE', 'KCSE'])), q = el('input', { type: 'search', placeholder: 'Search a school', ariaLabel: 'Search a school' }), box = el('div');
  const go = async () => { const p = new URLSearchParams({ sub_county: st.sub }); if (ex.value) p.set('exam', ex.value); if (q.value) p.set('q', q.value);
    const r = await j('/api/results?' + p);
    box.replaceChildren(...(r.length ? r.map(s => el('div', { className: 'row' }, [el('div', {}, [el('b', { textContent: s.school }), el('div', { textContent: `${s.exam} ${s.year}${s.candidates ? ' · ' + s.candidates + ' candidates' : ''}` })]),
      el('span', { textContent: [s.mean_score != null ? Number(s.mean_score) : null, s.mean_grade].filter(x => x != null && x !== '').join(' · ') })])) : [msg('No results yet.')])); };
  ex.onchange = q.onchange = go; await go();
  return [el('div', { className: 'tools' }, [ex, q]), box, msg('School averages only. Individual results are available from the official exam channels.')];
}
async function ticketsView() {
  const when = x => new Date(x).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  let mine = JSON.parse(localStorage.getItem('mytickets') || '[]'), pend = JSON.parse(localStorage.getItem('pendingtix') || '[]');
  for (const p of [...pend]) { try { const s = await j('/api/tix/status/' + p.pid);                    // payments that finished after the person left the page
    if (s.status === 'paid') { mine = [...s.tickets.map(t => ({ code: t.code, event: t.event, when: when(t.starts_at) })), ...mine]; pend = pend.filter(x => x.pid !== p.pid); }
    else if (s.status !== 'pending') pend = pend.filter(x => x.pid !== p.pid); } catch {} }
  localStorage.setItem('mytickets', JSON.stringify(mine.slice(0, 30))); localStorage.setItem('pendingtix', JSON.stringify(pend));
  const ev = await j('/api/tix/events');
  const card = e => {
    const qty = el('select', { ariaLabel: 'Number of tickets' }, opts(['1', '2', '3', '4', '5'])), name = el('input', { placeholder: 'Your name (optional)', ariaLabel: 'Your name' });
    const phone = el('input', { placeholder: 'M-Pesa number 2547XXXXXXXX', inputMode: 'numeric', ariaLabel: 'M-Pesa number' }), out = el('div');
    const done = tix => { localStorage.setItem('mytickets', JSON.stringify([...tix.map(t => ({ code: t.code, event: e.title, when: when(e.starts_at) })), ...JSON.parse(localStorage.getItem('mytickets') || '[]')].slice(0, 30)));
      out.replaceChildren(...tix.map(t => el('div', { className: 'note' }, [el('div', { className: 'k', textContent: 'Your ticket' }), el('b', { textContent: t.code }), el('small', { textContent: 'Show this code at the door. Take a screenshot.' })]))); };
    const buy = el('button', { className: 'alt', textContent: e.left < 1 ? 'Sold out' : e.price_kes ? 'Buy with M-Pesa' : 'Get free ticket', disabled: e.left < 1, onclick: async () => {
      out.replaceChildren(msg('Sending...'));
      try {
        const r = await fetch('/api/tix/buy', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ event_id: e.id, qty: qty.value, name: name.value, phone: phone.value }) });
        const d = await r.json(); if (!r.ok) throw new Error(d.error);
        if (!d.pid) return done(d.codes.map(code => ({ code })));
        localStorage.setItem('pendingtix', JSON.stringify([{ pid: d.pid }, ...JSON.parse(localStorage.getItem('pendingtix') || '[]')]));
        out.replaceChildren(msg(d.message));
        for (let i = 0; i < 30; i++) { await new Promise(z => setTimeout(z, 3000)); const s = await j('/api/tix/status/' + d.pid);
          if (s.status === 'paid') { localStorage.setItem('pendingtix', JSON.stringify(JSON.parse(localStorage.getItem('pendingtix') || '[]').filter(x => x.pid !== d.pid))); return done(s.tickets); }
          if (s.status === 'failed') throw new Error('The payment was not completed.');
          if (s.status === 'underpaid') throw new Error('The amount received was too low. Contact us with your M-Pesa receipt.'); }
        throw new Error('Still waiting for payment. If you paid, your tickets will appear under My tickets when it is confirmed. Contact us with your M-Pesa receipt if they do not.');
      } catch (err) { out.replaceChildren(msg(err.message || 'Something went wrong. Try again.')); } } });
    return el('div', { className: 'note' }, [el('div', { className: 'k', textContent: `${when(e.starts_at)}${e.venue ? ' · ' + e.venue : ''}` }), el('b', { textContent: e.title }), el('p', { textContent: e.description || '' }),
      el('div', { textContent: `${e.price_kes ? 'KSh ' + e.price_kes : 'Free'} · ${e.left > 0 ? e.left + ' left' : 'sold out'} · by ${e.organiser}` }), el('div', { className: 'tools' }, [qty, name]), phone, buy, out]);
  };
  return [...(mine.length ? [sect('My tickets', mine.map(t => el('div', { className: 'note' }, [el('div', { className: 'k', textContent: t.event || 'Ticket' }), el('b', { textContent: t.code }), el('small', { textContent: t.when || '' })])))] : []),
    sect('Events', ev.length ? ev.map(card) : [msg('No ticketed events right now.')])];
}

async function hist(row, c) {                                     // tap a price to see the last weeks
  const old = row.querySelector('.hist'); if (old) return old.remove();
  try { const h = await j(`/api/prices/history?sub_county=${st.sub}&commodity=${encodeURIComponent(c)}`);
    if (h.length < 2) return row.append(el('div', { className: 'hist', textContent: 'The trend builds up as prices are posted each week.' }));
    const v = h.map(x => x.local), lo = Math.min(...v), hi = Math.max(...v), W = 220, H = 36;
    const pts = v.map((y, i) => `${(i / (v.length - 1) * W).toFixed(1)},${(hi === lo ? H / 2 : H - 4 - (y - lo) / (hi - lo) * (H - 8)).toFixed(1)}`).join(' ');
    row.append(el('div', { className: 'hist' }, [svg('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H }, [svg('polyline', { points: pts, fill: 'none', stroke: '#1b5510', 'stroke-width': 2 })]), el('small', { textContent: ` KSh ${v[0]} to ${v[v.length - 1]} over ${v.length} weeks` })]));
  } catch {}
}

      g.onclick = () => { info.replaceChildren(card(s), el('p', { className: 'by', textContent: `${s.place_name ? s.place_name + ', ' : ''}${String(s.created_at).slice(0, 10)}` })); info.scrollIntoView({ behavior: 'smooth' }); }; m.append(g); });
    const legend = el('div', { className: 'legend' }, Object.entries(TC).map(([k, v]) => el('span', {}, [el('i', { style: `background:${v}` }), k])));
    return [el('div', { className: 'tools' }, [range]), el('div', { className: 'tools' }, [from, to]), m, legend, msg(`${data.stories.length} stories in this period. Tap a pin to read it.`), info];
  },
  async shows() {
    const tp = el('select', { ariaLabel: 'Show' }, opts([['', 'All shows'], 'politics', 'sports', 'business', 'culture', 'tourism', 'agriculture', 'general']));
    tp.value = st.show || ''; tp.onchange = () => { st.show = tp.value; render(); };
    const e = await j('/api/podcasts' + (st.show ? `?topic=${st.show}` : ''));
    return [el('div', { className: 'tools' }, [tp]), ...(e.length ? e.map(x => el('article', {}, [player(x.video_url, 'ep' + x.id, x.thumb_url), el('h2', { textContent: x.title }), el('p', { className: 'by', textContent: x.topic })])) : [msg('No episodes yet.')])];
  }
};
async function render() {
  $('#voices').hidden = !['today', 'news'].includes(st.view);
  try { $('#view').replaceChildren(...await V[st.view]()); }
  catch { $('#view').replaceChildren(msg('No connection and nothing saved yet. Open this section once with data to read it offline.')); }
}
async function alerts() { try { const a = await j('/api/alerts'); $('#alert').hidden = !a.length;
  $('#alert').replaceChildren(el('span', { className: 'tag', textContent: 'Alert' }), el('span', { textContent: a.map(x => `${x.area ? x.area + ': ' : ''}${x.title}. ${x.body}`).join('  ') })); } catch {} }
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { st.view = b.dataset.view; document.querySelectorAll('nav button').forEach(x => x.toggleAttribute('aria-current', x === b)); render(); });
document.querySelectorAll('[data-paper]').forEach(b => b.onclick = () => { st.paper = b.dataset.paper; $('#logo').src = `/logo-${st.paper}.png`; $('#logo').alt = b.textContent; document.querySelectorAll('[data-paper]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); });
$('#sub').onchange = e => { st.sub = e.target.value; localStorage.setItem('sub', st.sub); render(); };
let ev; addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; $('#install').style.display = 'block'; });
$('#install').onclick = async () => { ev?.prompt(); await ev?.userChoice; track('install', 'pwa'); $('#install').style.display = 'none'; };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
$('#date').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
alerts(); render();
