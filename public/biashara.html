<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>List your business</title>
<link rel="stylesheet" href="/style.css"></head><body class="form page"><div class="mast"><img src="/logo-review.png" alt="The County Review"><img src="/logo-roundup.png" alt="County Roundup"></div>
<h1>List your business</h1><p>KSh 600 for 14 days. Customers tap Chat and message you on WhatsApp.</p>
<label for="n">Business name</label><input id="n" maxlength="100">
<label for="t">One line about what you offer</label><input id="t" maxlength="150">
<label for="c">Type</label><select id="c"><option>shop</option><option>hardware</option><option>guesthouse</option><option>restaurant</option><option>transport</option><option>farm produce</option><option>services</option><option>bakery</option><option>decor</option><option>catering</option><option>photography</option><option>florist</option><option>gifts</option><option>process-server</option><option>legal-runner</option><option>advocate</option><option>other</option></select>
<label for="s">Sub-county</label><select id="s"><option value="voi">Voi</option><option value="taveta">Taveta</option><option value="mwatate">Mwatate</option><option value="wundanyi">Wundanyi</option></select>
<label for="w">WhatsApp number <small>(2547XXXXXXXX)</small></label><input id="w" inputmode="numeric">
<label for="p">M-Pesa number to pay from <small>(2547XXXXXXXX)</small></label><input id="p" inputmode="numeric">
<button class="alt" id="loc" type="button">Add my shop's location</button><small id="ls"></small>
<button id="pay" type="button">Pay KSh 600 with M-Pesa</button><div id="m" hidden role="status"></div>
<p><a href="/verify.html">Already listed? Get a Verified badge.</a></p>
<script>
const $=s=>document.querySelector(s);let pos=null;
$('#loc').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{pos=p.coords;$('#ls').textContent=' Location saved.'},()=>{$('#ls').textContent=' Could not get location.'});
$('#pay').onclick=async()=>{const m=$('#m');m.hidden=false;m.className='';m.textContent='Sending…';
 try{const r=await fetch('/api/biashara/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sub_county:$('#s').value,business_name:$('#n').value,tagline:$('#t').value,category:$('#c').value,whatsapp:$('#w').value,phone:$('#p').value,latitude:pos?.latitude,longitude:pos?.longitude})});
 const d=await r.json();if(!r.ok)throw new Error(d.error);m.textContent=d.message}catch(e){m.className='e';m.textContent=e.message||'Something went wrong. Try again.'}};
</script></body></html>
