<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Close your notice</title><link rel="stylesheet" href="/style.css"></head>
<body class="form page"><div class="mast"><img src="/logo-review.png" alt="The County Review"><img src="/logo-roundup.png" alt="County Roundup"></div>
<h1>Close your notice</h1><p>Thank you for letting us know. This removes your lost and found notice.</p>
<button id="go" type="button">The item has been returned: remove my notice</button><div id="m" hidden role="status"></div>
<script>
const $=s=>document.querySelector(s),q=new URLSearchParams(location.search);
$('#go').onclick=async()=>{const m=$('#m');m.hidden=false;m.className='';m.textContent='Sending...';
 try{const r=await fetch(`/api/boards/${encodeURIComponent(q.get('id')||'')}/resolve`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t:q.get('t')})});const d=await r.json();if(!r.ok)throw new Error(d.error);m.textContent='Your notice has been removed.';$('#go').hidden=true}catch(e){m.className='e';m.textContent=e.message||'Something went wrong.'}};
</script></body></html>
